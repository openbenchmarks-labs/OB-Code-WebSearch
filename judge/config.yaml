# The LLM verifier never changes a score. The first reader reads every answer; the second reads again only where the
# first disagrees or is unsure. A row the second reader still disagrees with or is unsure of goes to a person.
# Both run on AWS Bedrock (Converse API), with the prices and limits the 15-17 Nov 2026 verifier runs used.
verifier:
  first:
    model: us.anthropic.claude-haiku-5-5
    max_tokens: 6000
    usd_per_mtok: {input: 0.11, output: 0.55}
  second:
    model: us.anthropic.claude-sonnet-5-5
    max_tokens: 6000
    usd_per_mtok: {input: 2.20, output: 11.00}
# One answer: a first reading, and a second one where needed. max is the most both readings can cost at max_tokens.
verify_usd: {expected: 0.005, max: 0.10, source: judge/config.yaml prices at max_tokens, date: 2026-11-24}
