model: gpt-6-sol
effort: medium
limits:
  max_turns: 32
  max_searches: 5
  max_fetches: 5
  results_per_search: 8
usd_per_mtok: {input: 2.00, output: 10.00}
# The model cost of one answer at usd_per_mtok, the rates the harness bills each answer at; search and fetch fees are each
# setup's pricing.answer_usd in tools/. An answer that costs more than its hold stops the run, so max sits about 3x above
# the largest answer seen.
answer_usd:
  expected: 0.11
  max: 3.00
  source: 17 Nov val run on gpt-6-sol medium, 4,507 answers over 14 arms, tokens at usd_per_mtok, mean $0.104, largest $0.96
  date: 2026-11-23
