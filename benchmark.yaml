name: OB-Code-Websearch
serves: Teams choosing a web search API as the search step of a coding agent that writes code against enterprise product APIs (Workday, SAP, UKG, Veeva, Genesys, ServiceNow).
win: The search API with which the agent answers more ranked questions in the held-out set with a request the ground truth accepts, under the same model, budget, and day; ties within noise.
obkit: 0.4.0
sets:
  public: {path: data/questions.jsonl}
  validation: {sha256: 2949a6e82e9c9b4ad8cd6129cb44f2d0cbb69cb582f57c082ee673c584303728}
  private: {sha256: b1661094954c3b896bdbb6e1f97f72b0c8da84cb7d715db39aa7285635ecb64f}
question_id: task_id
split_axes: [vendor, kind]
split_gap_max: 0.1
ranked_set: private
modes: [search_only, search_and_fetch]
baselines: [no_search]
window_hours: 24
concurrency: 4
repeats: 3
budget_usd: 0
refresh_days: 30
not_measured_max: 0.1
judge_error_max: 0.05
hooks:
  selftest: python -B -m harness.run selftest --tasks data/questions.jsonl
  answer: harness.obkit:answer
  contract: harness.obkit:contract
  probe: harness.obkit:probe
  grade: judge.obkit:grade
  verify: judge.obkit:verify
  key_check: judge.obkit:key_check
